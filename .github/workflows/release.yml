name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rom-mod.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rom-mod
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: rom-mod
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="rom-mod-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" LICENSE README.md "$name/"
          if [[ "${{ matrix.os }}" == windows-latest ]]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rom-mod-*.zip
            rom-mod-*.tar.gz
