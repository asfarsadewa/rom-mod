[package]
name = "rom-mod"
version = "0.1.0"
edition = "2021"
description = "A cheat-to-patch workbench for NES, Super NES and Mega Drive ROMs"
license = "MIT"
repository = "https://github.com/asfarsadewa/rom-mod"

[dependencies]
anyhow = "1"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
ureq = { version = "2", features = ["tls"] }
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
